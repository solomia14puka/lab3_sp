<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Візуалізація AST дерева</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .node circle { fill: #fff; stroke: #4caf50; stroke-width: 3px; }
        .node text { font: 14px sans-serif; font-weight: bold; }
        .link { fill: none; stroke: #ccc; stroke-width: 2px; }
    </style>
</head>
<body>
    <h2>Абстрактне синтаксичне дерево (AST)</h2>
    <div id="tree"></div>
    <script>

        const treeData = {"name": "Declaration", "value": "a", "children": [{"name": "Addition", "value": "+", "children": [{"name": "Number", "value": "5"}, {"name": "Number", "value": "5"}]}]}

        // Код D3.js для малювання дерева
        const margin = {top: 40, right: 90, bottom: 50, left: 90},
              width = 800 - margin.left - margin.right,
              height = 500 - margin.top - margin.bottom;

        const svg = d3.select("#tree").append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + (width/2 + margin.left) + "," + margin.top + ")");

        const treemap = d3.tree().size([width, height]);
        const root = d3.hierarchy(treeData, d => d.children);
        const nodes = treemap(root);

        const link = svg.selectAll(".link")
            .data(nodes.descendants().slice(1))
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d => `M${d.x},${d.y}C${d.x},${(d.y + d.parent.y) / 2} ${d.parent.x},${(d.y + d.parent.y) / 2} ${d.parent.x},${d.parent.y}`);

        const node = svg.selectAll(".node")
            .data(nodes.descendants())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x},${d.y})`);

        node.append("circle").attr("r", 12);
        node.append("text")
            .attr("dy", ".35em")
            .attr("y", d => d.children ? -25 : 25)
            .style("text-anchor", "middle")
            .text(d => d.data.name + (d.data.value ? ` (${d.data.value})` : ""));
    </script>
</body>
</html>
